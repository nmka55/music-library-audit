[project]
name = "music-library-audit"
version = "0.2.0"
description = "A local, read-only audit of a music library XML export against offline audio folders"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "mutagen>=1.47,<2",
  "rapidfuzz>=3,<4",
  "openpyxl>=3.1,<4",
  "tqdm>=4.66,<5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"
